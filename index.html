  /* Marca: "Savia" en cursiva que se escribe sola (trazos de Great Vibes, sin cargar fuentes) */
  .savia-anim{display:block;width:220px;height:auto;overflow:visible}.savia-anim .sv-l{fill:#4A5424;fill-opacity:0;stroke:#4A5424;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:svTrazo .55s cubic-bezier(.5,0,.3,1) forwards,svRelleno .45s ease forwards;animation-delay:calc(var(--i) * .42s),calc(var(--i) * .42s + .45s)}@keyframes svTrazo{to{stroke-dashoffset:0}}@keyframes svRelleno{to{fill-opacity:1;stroke-width:0}}@media (prefers-reduced-motion:reduce){.savia-anim .sv-l{animation:none;fill-opacity:1;stroke-width:0}}

  html,body{margin:0;padding:0;height:100%;background:#F6F7EE;font-family:'Outfit','Segoe UI',system-ui,sans-serif;color:#333A17}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F6F7EE}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#F6F7EE;transition:opacity .35s;z-index:2}
  #splash.off{opacity:0;pointer-events:none}
  #splash .leaf{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#55612A,#3E4720);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(74,84,36,.18)}
  #splash .leaf svg{width:48px;height:48px}
  #splash .n{font-size:22px;font-weight:600;color:#4A5424;letter-spacing:.3px}
  #splash .s{font-size:13px;color:#686D55}
  /* frutita que brinca y cambia en cada salto */
  .fruta{position:relative;width:64px;height:64px;margin:0 auto;display:block}
  .fruta::before{content:"\1F34E";position:absolute;left:50%;bottom:12px;margin-left:-20px;width:40px;text-align:center;font-size:34px;line-height:1;animation:frutaSalto .72s cubic-bezier(.35,0,.45,1) infinite,frutaCambio 5.76s steps(1,end) infinite}
  .fruta::after{content:"";position:absolute;left:50%;bottom:6px;width:30px;height:8px;margin-left:-15px;border-radius:50%;background:rgba(74,84,36,.2);animation:frutaSombra .72s cubic-bezier(.35,0,.45,1) infinite}
  @keyframes frutaSalto{0%,100%{transform:translateY(0) scale(1.14,.84)}30%{transform:translateY(-18px) scale(.96,1.06)}50%{transform:translateY(-28px) scale(1,1)}70%{transform:translateY(-16px) scale(.98,1.04)}}
  @keyframes frutaSombra{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.5);opacity:.3}}
  @keyframes frutaCambio{0%{content:"\1F34E"}12.5%{content:"\1F34C"}25%{content:"\1F353"}37.5%{content:"\1F34A"}50%{content:"\1F95D"}62.5%{content:"\1F347"}75%{content:"\1F349"}87.5%{content:"\1F350"}}
  #err{display:none;max-width:420px;margin:0 20px;padding:14px 16px;background:#fff;border:1px solid #E2E5CE;border-radius:14px;font-size:14px;line-height:1.5;text-align:center}
  #err a{color:#4A5424;font-weight:600}
  /* Aviso para instalar (solo cuando NO está instalada) */
  #tip{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:3;display:none;gap:12px;align-items:center;background:#333A17;color:#fff;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #tip.on{display:flex}
  #tip .ic{width:38px;height:38px;border-radius:11px;flex:0 0 38px;background:linear-gradient(135deg,#55612A,#3E4720);display:flex;align-items:center;justify-content:center}
  #tip .ic svg{width:26px;height:26px}
  #tip .tx{flex:1}
  #tip b{color:#C6D287}
  #tip button{background:transparent;border:0;color:#C6D287;font-size:20px;line-height:1;padding:4px 6px;cursor:pointer}

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var a = String(q.get('a') || '').trim();      // ID de la implementación de Apps Script
  var t = String(q.get('t') || '').trim();      // token del paciente
  var okA = /^[A-Za-z0-9_-]{20,}$/.test(a), okT = /^[A-Za-z0-9_-]{4,64}$/.test(t);
  var err = document.getElementById('err'), fr = document.getElementById('app');
  if (!okA || !okT){
    document.getElementById('dots').style.display = 'none';
    document.getElementById('splashTxt').textContent = '';
    err.style.display = 'block';
    err.innerHTML = 'Este enlace está incompleto. Pide a tu consultorio que te comparta de nuevo tu liga de Savia.';
    return;
  }
  var destino = 'https://script.google.com/macros/s/' + a + '/exec?page=paciente&t=' + encodeURIComponent(t);
  var listo = false;
  function quitarSplash(){ if (listo) return; listo = true; document.getElementById('splash').classList.add('off'); }
  fr.addEventListener('load', function(){ setTimeout(quitarSplash, 250); });
  fr.src = destino;
  // Mensajes mientras Google abre la app (en celular puede tardar 10-20 s la primera vez).
  var MSGS = ['Abriendo tu plan…', 'Conectando con tu consultorio…', 'Google está preparando tu app…', 'Ya casi…'];
  var mi = 0;
  var rot = setInterval(function(){ if (listo){ clearInterval(rot); return; } mi = Math.min(mi + 1, MSGS.length - 1); document.getElementById('splashTxt').textContent = MSGS[mi]; }, 5000);
  // Si de plano no llega, se deja un enlace directo de respaldo.
  setTimeout(function(){
    if (listo) return;
    err.style.display = 'block';
    err.innerHTML = 'Está tardando más de lo normal. <a href="' + destino + '">Abrir directo en el navegador</a>';
    setTimeout(quitarSplash, 8000);
  }, 30000);

  // Aviso de instalación (una vez por dispositivo, solo si no está instalada)
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  var visto = false; try { visto = localStorage.getItem('savia_tip_inicio') === '1'; } catch(e){}
  var ua = navigator.userAgent || '';
  var esIOS = /iPhone|iPad|iPod/.test(ua), esAndroid = /Android/.test(ua);
  if (!standalone && !visto && (esIOS || esAndroid)){
    var txt = esIOS
      ? 'Ten tu plan a la mano: toca <b>Compartir</b> <span style="font-size:15px">⎙</span> y luego <b>Agregar a pantalla de inicio</b>.'
      : 'Ten tu plan a la mano: abre el menú <b>⋮</b> y elige <b>Agregar a pantalla de inicio</b>.';
    document.getElementById('tipTxt').innerHTML = txt;
    setTimeout(function(){ document.getElementById('tip').classList.add('on'); }, 2500);
  }
  window.cerrarTip = function(){ document.getElementById('tip').classList.remove('on'); try { localStorage.setItem('savia_tip_inicio', '1'); } catch(e){} };
})();
</script>
</body>
</html>
