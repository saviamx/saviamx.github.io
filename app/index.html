<script>
(function(){
  // La liga viaja después del "#" (#a=ID&k=CLAVE): esa parte NUNCA se manda a GitHub, solo la lee
  // esta página. Se recuerda en este navegador por si la app instalada abre sin ella.
  var q = new URLSearchParams(String(location.hash || '').replace(/^#/, ''));
  var a = String(q.get('a') || '').trim(), k = String(q.get('k') || '').trim();
  var okA = /^[A-Za-z0-9_-]{20,}$/.test(a);
  try {
    if (okA){ localStorage.setItem('savia_app_a', a); localStorage.setItem('savia_app_k', k); }
    else { a = localStorage.getItem('savia_app_a') || ''; k = localStorage.getItem('savia_app_k') || ''; okA = /^[A-Za-z0-9_-]{20,}$/.test(a); }
  } catch(e){}
  var err = document.getElementById('err'), fr = document.getElementById('app');
  function aviso(html){ document.getElementById('splashTxt').textContent = ''; err.style.display = 'block'; err.innerHTML = html; }
  if (!okA){ aviso('Este enlace está incompleto. Ábrelo desde Savia: barra lateral › <b>Agregar al Dock</b>.'); return; }
  var destino = 'https://script.google.com/macros/s/' + a + '/exec?page=app' + (k ? '&k=' + encodeURIComponent(k) : '');
  var listo = false;
  function quitarSplash(){ if (listo) return; listo = true; document.getElementById('splash').classList.add('off'); }

  // La app avisa {saviaHola} al cargar; se le contesta {saviaShell} para que esconda "Agregar al Dock".
  // Si el aviso no llega (varias cuentas de Google abiertas), se reintenta UNA vez sin cookies de Google.
  var hola = false, intento = 0, espera = null;
  window.addEventListener('message', function(ev){
    if (ev && ev.data && ev.data.saviaHola){
      hola = true; if (espera){ clearTimeout(espera); } quitarSplash();
      try { ev.source.postMessage({ saviaShell: 1 }, '*'); } catch(e){}
    }
  });
  function cargar(sinCookies){
    intento++;
    var nuevo = document.createElement('iframe');
    nuevo.id = 'app'; nuevo.title = 'Savia';
    nuevo.setAttribute('allow', 'clipboard-write; web-share; microphone; camera');
    nuevo.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    if (sinCookies){ nuevo.setAttribute('credentialless', ''); try { nuevo.credentialless = true; } catch(e){} }
    nuevo.addEventListener('load', function(){
      if (hola){ quitarSplash(); return; }
      if (espera){ clearTimeout(espera); }
      espera = setTimeout(function(){
        if (hola) return;
        if (intento === 1){ document.getElementById('splashTxt').textContent = 'Un momento, abriendo de otra forma…'; cargar(true); }
        else { quitarSplash(); }   // se deja ver lo que haya cargado (p. ej. la pantalla de clave)
      }, 20000);
    });
    nuevo.src = destino + (sinCookies ? '&cl=1' : '');
    fr.parentNode.replaceChild(nuevo, fr); fr = nuevo;
  }
  cargar(false);
  // Si cambia la clave (Ajustes), la página recibe la liga nueva solo en el "#": se recarga para usarla.
  window.addEventListener('hashchange', function(){ location.reload(); });
  setTimeout(function(){
    if (listo || err.style.display === 'block') return;
    err.style.display = 'block';
    err.innerHTML = 'Está tardando más de lo normal. <a href="' + destino + '">Abrir directo en el navegador</a>';
  }, 45000);
})();
</script>
